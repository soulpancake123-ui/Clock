<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbital Clock</title>

<style>
  body {
    background: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    color: #e8c782;
  }

  .clock-container {
    position: relative;
    width: 300px;
    height: 300px;
  }

  /* circular orbit lines */
  .orbit {
    position: absolute;
    border: 2px solid #e8c782;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  #orbit1 { width: 240px; height: 240px; }
  #orbit2 { width: 160px; height: 160px; }
  #orbit3 { width: 80px;  height: 80px;  }

  /* planets */
  .planet {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #e8c782;
    top: 50%;
    left: 50%;
    transform-origin: -100px center;
  }

  #p1 { animation: spin 18s linear infinite; transform-origin: -120px center; }
  #p2 { animation: spin 12s linear infinite; transform-origin: -80px center;  }
  #p3 { animation: spin 6s linear infinite; transform-origin: -40px center;  }

  @keyframes spin {
    from { transform: rotate(0deg) translateX(0); }
    to   { transform: rotate(360deg) translateX(0); }
  }

  /* center content */
  .center-circle {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e8c782;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .time {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -150%);
    text-align: center;
    font-size: 20px;
  }

  .day {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, 10%);
    font-size: 14px;
  }
</style>

</head>
<body>

<div class="clock-container">

  <div class="orbit" id="orbit1"></div>
  <div class="orbit" id="orbit2"></div>
  <div class="orbit" id="orbit3"></div>

  <div class="planet" id="p1"></div>
  <div class="planet" id="p2"></div>
  <div class="planet" id="p3"></div>

  <div class="center-circle"></div>

  <div class="time" id="time"></div>
  <div class="day" id="day"></div>

</div>

<script>
function updateClock() {
  const now = new Date();
  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");

  const suffix = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;

  document.getElementById("time").textContent = `${hours}:${minutes}:${seconds} ${suffix}`;
  
  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  document.getElementById("day").textContent = weekday;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
