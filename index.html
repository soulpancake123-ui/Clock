<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbital Clock</title>

<style>
  body {
    background: #0d0d0d;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: #e8c782;
  }

  .clock-container {
    position: relative;
    width: 280px;
    height: 280px;
  }

  /* Orbit rings — sized smaller to avoid text collision */
  .orbit {
    position: absolute;
    border: 2px solid #e8c782;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  #orbit1 { width: 220px; height: 220px; }
  #orbit2 { width: 150px; height: 150px; }
  #orbit3 { width: 80px;  height: 80px; }

  /* Planets */
  .planet {
    position: absolute;
    width: 16px;
    height: 16px;
    background: #e8c782;
    border-radius: 50%;
    top: 50%; left: 50%;
  }

  /* Orbit distances exactly half of ring diameter */
  @keyframes o1 { from { transform: rotate(0deg) translateX(110px); }
                  to   { transform: rotate(360deg) translateX(110px);} }
  @keyframes o2 { from { transform: rotate(0deg) translateX(75px); }
                  to   { transform: rotate(360deg) translateX(75px);} }
  @keyframes o3 { from { transform: rotate(0deg) translateX(40px); }
                  to   { transform: rotate(360deg) translateX(40px);} }

  #p1 { animation: o1 20s linear infinite; }
  #p2 { animation: o2 14s linear infinite; }
  #p3 { animation: o3 8s linear infinite; }

  /* Center body (sun) */
  .center {
    position: absolute;
    width: 28px;
    height: 28px;
    background: #e8c782;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Time + day, moved up so they never overlap rings */
  .time {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -165%);
    font-size: 20px;
    white-space: nowrap;
  }

  .day {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -105%);
    font-size: 14px;
  }
</style>

</head>
<body>

<div class="clock-container">

  <div class="orbit" id="orbit1"></div>
  <div class="orbit" id="orbit2"></div>
  <div class="orbit" id="orbit3"></div>

  <div class="planet" id="p1"></div>
  <div class="planet" id="p2"></div>
  <div class="planet" id="p3"></div>

  <div class="center"></div>

  <div class="time" id="time"></div>
  <div class="day" id="day"></div>

</div>

<script>
function updateClock() {
  const now = new Date();
  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");

  const suffix = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;

  document.getElementById("time").textContent = `${hours}:${minutes}:${seconds} ${suffix}`;

  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  document.getElementById("day").textContent = weekday;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
