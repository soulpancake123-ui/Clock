<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbital Clock</title>

<style>
  body {
    background: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    color: #e8c782;
  }

  .clock-container {
    position: relative;
    width: 320px;
    height: 320px;
  }

  /* Orbit rings */
  .orbit {
    position: absolute;
    border: 2px solid #e8c782;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  #orbit1 { width: 260px; height: 260px; }
  #orbit2 { width: 180px; height: 180px; }
  #orbit3 { width: 100px; height: 100px; }

  /* Planet base class */
  .planet {
    position: absolute;
    width: 18px;
    height: 18px;
    background: #e8c782;
    border-radius: 50%;
    top: 50%; left: 50%;
  }

  /* Perfect orbiting motion */
  #p1 {
    animation: orbit1 20s linear infinite;
  }

  #p2 {
    animation: orbit2 13s linear infinite;
  }

  #p3 {
    animation: orbit3 8s linear infinite;
  }

  /* Spin formulas using rotate + translate */
  @keyframes orbit1 {
    from { transform: rotate(0deg) translateX(130px); }
    to   { transform: rotate(360deg) translateX(130px); }
  }

  @keyframes orbit2 {
    from { transform: rotate(0deg) translateX(90px); }
    to   { transform: rotate(360deg) translateX(90px); }
  }

  @keyframes orbit3 {
    from { transform: rotate(0deg) translateX(50px); }
    to   { transform: rotate(360deg) translateX(50px); }
  }

  /* center planet */
  .center {
    position: absolute;
    width: 30px;
    height: 30px;
    background: #e8c782;
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  /* Text placement */
  .time {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -120%);
    text-align: center;
    font-size: 20px;
  }

  .day {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -10%);
    font-size: 14px;
  }
</style>

</head>
<body>

<div class="clock-container">

  <div class="orbit" id="orbit1"></div>
  <div class="orbit" id="orbit2"></div>
  <div class="orbit" id="orbit3"></div>

  <div class="planet" id="p1"></div>
  <div class="planet" id="p2"></div>
  <div class="planet" id="p3"></div>

  <div class="center"></div>

  <div class="time" id="time"></div>
  <div class="day" id="day"></div>

</div>

<script>
function updateClock() {
  const now = new Date();
  let hours = now.getHours();
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");

  const suffix = hours >= 12 ? "PM" : "AM";
  hours = hours % 12 || 12;

  document.getElementById("time").textContent = `${hours}:${minutes}:${seconds} ${suffix}`;
  
  const weekday = now.toLocaleDateString("en-US", { weekday: "long" });
  document.getElementById("day").textContent = weekday;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
